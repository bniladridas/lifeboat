---

name: Test Packages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        package:
          - lifeboat_sdk
          - modelscope_upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests for ${{ matrix.package }}
        run: PYTHONPATH=. pytest tests/test_${{ matrix.package }}.py
