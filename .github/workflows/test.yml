---

name: Tests

on:
  push:
    branches: [main, test-e2e-workflow]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn joblib

      - name: Run unit tests
        run: |
          python -m pytest tests/test_inference.py -v --tb=short

  e2e-tests:
    runs-on: macOS-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scikit-learn joblib

      - name: Check model files exist
        run: |
          ls -la models/

      - name: Run e2e tests
        run: |
          python -m pytest tests/test_e2e.py -v --tb=short

  lint:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check .
