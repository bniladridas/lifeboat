---
name: Databricks CI

on:
  push:
    branches: [main, develop]
    paths:
      - "**.ipynb"
      - ".github/workflows/databricks-ci.yml"
  pull_request:
    branches: [main]

concurrency:
  group: databricks-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "0.0.1")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install \
            databricks-connect==14.1.0 \
            nbformat nbconvert pytest joblib scikit-learn

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q --tb=short

  databricks-sync:
    name: Sync Notebooks to Databricks
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: pip install databricks-cli>=0.205

      - name: Import notebooks
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          databricks workspace import lifeboat.ipynb /Users/${{ github.actor }}/lifeboat --language python --overwrite || true

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.test.outputs.version }}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: dev

    steps:
      - run: |
          echo "Deploying ${{ needs.build.outputs.image }} to dev"
          docker pull ${{ needs.build.outputs.image }}

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - run: |
          echo "Deploying ${{ needs.build.outputs.image }} to prod"
          echo "Version: ${{ needs.test.outputs.version }}"
