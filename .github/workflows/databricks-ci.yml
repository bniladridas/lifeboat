---
name: Databricks CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.ipynb"
      - ".github/workflows/databricks-ci.yml"
  pull_request:
    branches:
      - main

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.1")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install databricks-connect==14.1.0 nbformat nbconvert pytest joblib scikit-learn

      - name: Install package
        run: pip install -e .

      - name: Validate notebooks
        run: python .github/scripts/validate_notebooks.py

      - name: Run tests
        run: pytest tests/ -v --tb=short -q

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://databricks.com/cli/install.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"

      - name: Export notebooks to Databricks
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          export PATH="$HOME/bin:$PATH"
          dbfs cp -r notebooks/ dbfs:/path/to/notebooks/ || true
          databricks workspace import notebooks/ --overwrite || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.build.outputs.imageid }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    environment:
      name: dev
      url: https://dev.example.com
    steps:
      - name: Deploy
        run: |
          echo "Deploying image ${{ needs.build.outputs.image }} to dev"
          docker pull ${{ needs.build.outputs.image }}
          echo "Dev deployment complete"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render staging..."
          echo "Image: ${{ needs.build.outputs.image }}"
          echo "Staging deployment complete"

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-staging
      - test
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://prod.example.com
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render production..."
          echo "Image: ${{ needs.build.outputs.image }}"
          echo "Production deployment complete"

      - name: Notify
        run: |
          echo "Production deployment triggered for version ${{ needs.test.outputs.version }}"
