---

name: Test CLA Bot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('cla-signers.json', 'utf8'))" && echo "JSON valid"
